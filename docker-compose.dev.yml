# Dev override: hot-reload API + user-bot + admin-bot
services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command:
      [
        "sh",
        "-c",
        "exec python -m watchfiles --filter python 'python -m src.api.main' src config",
      ]
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./debug:/app/debug
      - ./data:/app/data

  user-bot:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command:
      [
        "sh",
        "-c",
        "exec python -m watchfiles --filter python 'python -m src.main' src config",
      ]
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./debug:/app/debug
      - ./data:/app/data

  admin-bot:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command:
      [
        "sh",
        "-c",
        "exec python -m watchfiles --filter python 'python -m src.admin_bot.main' src config",
      ]
    volumes:
      - ./src:/app/src
      - ./config:/app/config:ro
      - ./debug:/app/debug
      - ./data:/app/data
