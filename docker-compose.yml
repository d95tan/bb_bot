services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./debug:/app/debug
      - ./data:/app/data
      - ./config:/app/config:ro
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    command: ["python", "-m", "src.api.main"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  user-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./debug:/app/debug
      - ./data:/app/data
      - ./config:/app/config:ro
    command: ["python", "-m", "src.main"]

  admin-bot:
    build: .
    restart: unless-stopped
    profiles: ["admin"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./debug:/app/debug
      - ./data:/app/data
      - ./config:/app/config:ro
    command: ["python", "-m", "src.admin_bot.main"]

volumes:
  redis_data:
